name: post-deploy smoke

# Post-deploy production smoke gate.
#
# See docs/observability/post-deploy-smoke.md for the operator runbook.
#
# THE CHECKS THEMSELVES ARE NOT IN THIS FILE ANY MORE (close-out H2,
# 8 September 2026). They live in scripts/verify/post-deploy-smoke.mjs, which
# can be run before pushing and is covered by tests. They were six inline bash
# steps, and on 7 September that shape produced a false outage:
#
#   run 34143506887, main at 9ac4d885
#   curl: (35) Recv failure: Connection reset by peer
#   HTTP=000curl-failed
#   ::error::Anonymous request returned HTTP 000curl-failed, expected 200
#
# Production was serving correctly the whole time. Four faults, all fixed:
#
#   H2.1  a connection reset from a shared datacentre address was read as an
#         outage. Diagnosed in scripts/guards/machine-callers-reachable.mjs,
#         which also holds the invariant that nothing WE control can refuse a
#         caller that has already proved who it is.
#   H2.2  one attempt, no retry, and three different faults (a bad status, a
#         dead connection, a timeout) printed as one string.
#   H2.3  the deployment id never changed across all six polls, so the run
#         smoked the PREVIOUS build and then judged it.
#   H2.4  the alert email was never delivered. Resend answered 429, `curl -f`
#         discarded the body, and the step printed a warning and exited 0.
#
# Triggers:
#   deployment_status   when Vercel reports a PRODUCTION deploy succeeded. This
#                       is the primary trigger: a POST-DEPLOY gate should key
#                       off the DEPLOY, not off CI.
#   workflow_run        after CI on main completes. Belt and braces.
#   workflow_dispatch   manual re-run, with two switches for drilling it.
#
# WHY THE deployment_status TRIGGER EXISTS (2026-07-26). This gate was SKIPPED
# on every run from 2026-07-12 to 2026-07-26 and nobody noticed: the
# SUPABASE_ACCESS_TOKEN secret expired, the types-drift job failed, the CI run
# concluded `failure`, and the `workflow_run.conclusion == 'success'` condition
# below was false. A schema-drift guard losing its token must never silently
# disable the production smoke gate.
#
# Secrets:
#   CRON_SECRET      required. A missing one FAILS, it does not skip.
#   RESEND_API_KEY   alert channel 1. The GitHub issue channel needs no secret.

on:
  deployment_status:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_transport_probe:
        description: 'Also run the transport probe (H2.1 reproduction) from this runner'
        type: boolean
        default: false
      force_failure:
        description: 'Deliberately fail the smoke, to prove the alert channels deliver (H2.5)'
        type: boolean
        default: false
      expect_sha:
        description: 'Pin the smoke to a commit. Empty means judge whatever is live and say so.'
        type: string
        default: ''

permissions:
  contents: read
  # Alert channel 2 opens or comments on an issue when the smoke fails. It
  # exists because channel 1 shares a rate limit with every other message the
  # platform sends, and on 7 September that limit ate the only alert.
  issues: write

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: production homepage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Run when a PRODUCTION deploy succeeded (the primary path), when the
    # upstream CI succeeded (the secondary path), or on a manual dispatch.
    # The deployment_status arm is deliberately NOT conditioned on CI: a
    # deployed production build must be smoked even if some other CI job is red,
    # which is exactly the state that silenced this gate for two weeks.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
       || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
       || (github.event_name == 'deployment_status'
           && github.event.deployment_status.state == 'success'
           && github.event.deployment.environment == 'Production') }}

    env:
      # The CANONICAL host (founder ruling, docs/verification/blockers-round-2-2026-07-25.md).
      # It was https://www.eventlinqs.com, which is one of the three hosts the
      # canonical 301 redirects. Smoking a host that is about to become a
      # redirect is a gate with a scheduled expiry date.
      PROD_URL: https://www.eventlinqs.com.au
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Identify the commit under test
        # H2.3. Each trigger carries the commit in a different place, and both
        # field names were confirmed against the REST API rather than assumed:
        # a deployment carries `sha`, a workflow run carries `head_sha`. If none
        # of them resolves, the smoke runs UNPINNED and says so in its own
        # output; it never quietly judges whatever happens to be live.
        id: under_test
        env:
          EVENT: ${{ github.event_name }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.event.inputs.expect_sha }}
        run: |
          set -u
          # A MANUAL DISPATCH IS UNPINNED BY DEFAULT, and that is not a weakening
          # of H2.3. The operator picks the ref, and a ref is almost never the
          # commit production is serving, so pinning to github.sha would make
          # every manual re-run fail for the wrong reason. Unpinned, the smoke
          # prints the commit it judged; expect_sha pins it deliberately.
          case "$EVENT" in
            deployment_status) SHA="${DEPLOYMENT_SHA:-}" ;;
            workflow_run)      SHA="${WORKFLOW_RUN_SHA:-}" ;;
            *)                 SHA="${DISPATCH_SHA:-}" ;;
          esac
          if [ -z "$SHA" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "::warning::No commit sha on the $EVENT payload; the smoke will run unpinned and report what it judged."
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "commit under test: ${SHA:-none}"

      - name: Smoke production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_FAILURE: ${{ github.event.inputs.force_failure }}
          # Through the environment, never interpolated into the script body.
          # EXPECT_SHA can originate in a workflow_dispatch input, and a value
          # pasted straight into a `run:` block is a shell injection waiting for
          # someone with write access to have a bad day.
          EXPECT_SHA: ${{ steps.under_test.outputs.sha }}
        run: |
          set -u
          if [ "${FORCE_FAILURE:-false}" = "true" ]; then
            # H2.5. The drill: smoke a path this site answers 404 for, so the
            # alert channels are proven on a real failure rather than on a
            # mock. It is a deliberate switch on a manual dispatch only.
            echo "::warning::force_failure was requested: smoking a deliberately wrong host to prove the alert channels."
            node scripts/verify/post-deploy-smoke.mjs \
              --url "https://smoke-drill.invalid" \
              --wait-seconds 30 \
              --attempts 3 \
              --report smoke-report.json
          else
            node scripts/verify/post-deploy-smoke.mjs \
              --url "$PROD_URL" \
              --expect-sha "$EXPECT_SHA" \
              --wait-seconds 240 \
              --attempts 4 \
              --report smoke-report.json
          fi

      - name: Browser-level map guard (post-deploy)
        # Opt-in blocking: enable the repo variable MAP_GUARD_ENABLED=true once
        # production maps are confirmed live (env key baked, code deployed, event
        # coordinates present). Until then it is skipped so it cannot red every
        # deploy for a known-pending prod state. It loads real map surfaces in a
        # browser and asserts a live Google canvas, not just a key string.
        if: ${{ vars.MAP_GUARD_ENABLED == 'true' }}
        run: |
          set -u
          npx playwright install chromium >/dev/null 2>&1 || true
          node scripts/verify/map-guard.mjs "$PROD_URL" || { echo "::error::A map surface ships a dead (fallback) map"; exit 1; }

      - name: Transport probe
        # H2.1. Runs when the smoke FAILED, and on request. A connection reset
        # from a runner is the one fault that cannot be investigated after the
        # fact, because by the time anyone reads the log the condition is gone.
        # Measuring it in the same job, minutes later, is the only chance.
        # It never fails the job; it is an instrument.
        if: ${{ failure() || github.event.inputs.run_transport_probe == 'true' }}
        run: |
          set -u
          node scripts/verify/transport-probe.mjs \
            --url "$PROD_URL" \
            --rounds 20 \
            --gap-ms 400 \
            --report transport-probe.json

      - name: Alert on failure
        # H2.4. TWO channels that share no rate limit, and a loud failure if
        # both are silent. The old step was `curl ... || echo "::warning::"`,
        # which is how the one alert that mattered was lost.
        #
        # H2.6. The TARGET is passed as well as the report, so the drill marker
        # survives a run that failed before the report was written. The marker
        # itself is derived from the host, never from this line: a `.invalid`
        # target cannot be a real production smoke (RFC 2606).
        #
        # UX4.3. `--class outage` writes the subject, so this can never again be
        # confused in the inbox with a branch gate doing its job.
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ steps.under_test.outputs.sha }}
          REF_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE_FAILURE: ${{ github.event.inputs.force_failure }}
        run: |
          set -u
          TARGET="$PROD_URL"
          if [ "${FORCE_FAILURE:-false}" = "true" ]; then
            TARGET="https://smoke-drill.invalid"
          fi
          node scripts/ops/alert-dispatch.mjs \
            --class outage \
            --target "$TARGET" \
            --subject "the production homepage smoke FAILED" \
            --report smoke-report.json

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-smoke-${{ github.run_id }}
          path: |
            smoke-report.json
            transport-probe.json
          if-no-files-found: ignore
          retention-days: 14

  deploy-failed:
    # UX4.3, IMMEDIATE, OUTAGE ONLY. A production deployment that FAILS is one
    # of the three outages the owner asked to hear about immediately, and until
    # now it was the quietest of the three: the smoke job above only ever ran on
    # `state == 'success'`, so a build that never became a deployment produced
    # no alert from this repository at all. GitHub's own "deployment failed"
    # mail looks like every other Actions mail, which is UX4.3's complaint.
    #
    # Both `failure` and `error` are accepted because they are two different
    # GitHub deployment states and a provider may report either.
    name: production deployment failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ github.event_name == 'deployment_status'
       && github.event.deployment.environment == 'Production'
       && (github.event.deployment_status.state == 'failure'
           || github.event.deployment_status.state == 'error') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.deployment_status.target_url }}
          COMMIT_SHA: ${{ github.event.deployment.sha }}
          REF_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.deployment_status.state }}
          DESCRIPTION: ${{ github.event.deployment_status.description }}
        run: |
          set -u
          {
            echo "The production deployment did not become live."
            echo "State reported: ${STATE}"
            echo "Description: ${DESCRIPTION:-none given}"
            echo "Commit: ${COMMIT_SHA}"
            echo ""
            echo "Production is still serving the previous deployment. Nothing has been"
            echo "taken down, but nothing new has gone out either, so anything you were"
            echo "waiting to see live is not live."
          } > deploy-failed.txt
          node scripts/ops/alert-dispatch.mjs \
            --class outage \
            --target "https://www.eventlinqs.com.au" \
            --subject "the production deployment FAILED" \
            --body-file deploy-failed.txt
