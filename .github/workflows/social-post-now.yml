# POST ONE NIGHT NOW, FROM OUR SIDE (Lawal, 22 November 2026, 00:32: "her post goes to Facebook and Instagram now ... I
# don't care about the time ... the schedule"; his 01:23: posting is done by the engine from our side through Blotato, never
# through Lawal in the admin). Started by hand, for one night named by its id. It calls production's own social run with
# ?post=now and the secret only this repository's Actions hold; the run draws that night's feed post on its permitted
# photograph, approves it checked, gives it a slot at this minute (the posting hours waived for that night by the owner's
# word, and nothing else), publishes it through the publisher and reads it back (src/lib/social/store.ts postNightNow).
# No cron is added or quickened. The answer names the piece and each network's answer, never a person's address.
# LAWAL'S APPROVED SETS (the founder, 23 November 2026, 14:34; src/lib/social/approved-sets.ts): stage intake draws a set
# (set: its name) as an unapproved feed carousel for the PM's review; stage approve records only the checked approval of a
# drawn set's piece (piece: its id), and the ordinary scheduler gives it its band inside its window. Neither posts.
name: social post now

on:
  workflow_dispatch:
    inputs:
      stage:
        description: draw (draw the night's piece and stop for the PM's VERIFY), publish (the piece the PM passed), intake (draw an approved set, unapproved, for the PM's review) or approve (the checked approval of a drawn set's piece; nothing posts)
        required: true
        type: choice
        options: [draw, publish, intake, approve]
      set:
        description: for intake, the approved set's name (comedy-weekend, live-music, kyivska-perepichka)
        required: false
        type: string
      piece:
        description: for publish, the piece id the PM passed; for approve, the drawn set's piece id (a uuid)
        required: false
        type: string
      event:
        description: for draw and publish, the night's event id (a uuid), the night the owner's word names
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: social-post-now
  cancel-in-progress: false

jobs:
  post:
    name: one night drawn or posted, or an approved set drawn or approved, through the engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ask production's social run for the stage named
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGE: ${{ inputs.stage }}
          EVENT: ${{ inputs.event }}
          SET: ${{ inputs.set }}
          PIECE: ${{ inputs.piece }}
        run: |
          set -euo pipefail
          id='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          case "$STAGE" in
            draw|publish)
              [[ "$EVENT" =~ $id ]] || { echo "REFUSED: event $EVENT is not an id"; exit 2; }
              if [[ "$STAGE" == publish ]]; then [[ "$PIECE" =~ $id ]] || { echo "REFUSED: piece $PIECE is not an id"; exit 2; }; fi
              url="https://www.eventlinqs.com.au/api/cron/social-publish?post=now&event=${EVENT}&stage=${STAGE}&piece=${PIECE}" ;;
            intake)
              [[ "$SET" =~ ^[a-z0-9-]{3,60}$ ]] || { echo "REFUSED: set $SET is not a set name"; exit 2; }
              url="https://www.eventlinqs.com.au/api/cron/social-publish?post=now&stage=intake&set=${SET}" ;;
            approve)
              [[ "$PIECE" =~ $id ]] || { echo "REFUSED: piece $PIECE is not an id"; exit 2; }
              url="https://www.eventlinqs.com.au/api/cron/social-publish?post=now&stage=approve&piece=${PIECE}" ;;
            *) echo "REFUSED: stage $STAGE is not draw, publish, intake or approve"; exit 2 ;;
          esac
          code=$(curl -sS -o answer.json -w '%{http_code}' --max-time 280 "$url" -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat answer.json; echo
          [ "$code" = 200 ]
          case "$STAGE" in
            draw) grep -q '"drawn":true' answer.json ;;
            publish) grep -q '"posted":true' answer.json ;;
            intake) grep -q '"drawn":true' answer.json ;;
            approve) grep -q '"approved":true' answer.json ;;
          esac
