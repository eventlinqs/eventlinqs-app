name: state report

# THE DAILY STATE EMAIL AND THE STALL ALERT. Close-out UX4.1 and UX4.2.
#
# WHY THIS FILE EXISTS. From 00:23 to 09:28 on 9 September 2026 the build was
# stalled, six runs were killed, nothing was pushed for nine hours, and NOT ONE
# EMAIL was sent, because nothing failed. Every alerting mechanism this platform
# had was a FAILURE notification, and a stall produces silence. Silence is
# indistinguishable from a quiet healthy day unless something also arrives on a
# quiet healthy day.
#
# So there are two jobs and they answer two different questions:
#
#   daily  once a day at a fixed time, WHETHER OR NOT anything is wrong. Its
#          ABSENCE is itself the alert, which only works if it is unconditional.
#   stall  every hour, and it says something only when nothing has been pushed
#          for six hours. It alerts once per six-hour band, so a stall that
#          lasts a day produces four messages rather than twenty four.
#
# A SCHEDULE ONLY FIRES ON THE DEFAULT BRANCH. That is GitHub's rule, not a
# choice made here, and it means neither job runs until this file is on main.
# Until then `workflow_dispatch` is the way to run either of them.
#
# SECRETS, all of which already exist on this repository, so this workflow costs
# the owner no new credential and no dashboard visit (Law 10):
#   RESEND_API_KEY   the email channel.
#   VERCEL_TOKEN     to read the production deployment state.
#   CRON_SECRET      to ask production for the four platform counts.
#   GITHUB_TOKEN     supplied by Actions; reads runs, commits and pull requests,
#                    and is the second alert channel when the email fails.

on:
  schedule:
    # 21:10 UTC is 07:10 in Melbourne during AEST and 08:10 during AEDT, so it
    # lands in the morning either way without the workflow having to know which
    # half of the year it is. Ten past, not on the hour: GitHub's own scheduling
    # documentation warns that runs on the hour are the most contended.
    - cron: '10 21 * * *'
    # And hourly, for the stall check only.
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which report to run'
        type: choice
        options: [daily, stall]
        default: daily
      dry_run:
        description: 'Compose and print it without sending'
        type: boolean
        default: false

permissions:
  contents: read
  # The second alert channel. For the daily state it is held back unless the
  # email fails, because a digest that opens an issue every morning is exactly
  # the noise this item exists to remove.
  issues: write

concurrency:
  group: state-report-${{ github.event.schedule || github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  daily:
    name: the daily state
    if: ${{ github.event.schedule == '10 21 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # THE FORTNIGHTLY PARITY CHECK (close-out PARITY1), run IN THIS JOB rather
      # than in a workflow of its own.
      #
      # It could have been a second workflow. It is not, and the reason is the
      # handoff: the check writes its result to a file and this report reads it,
      # and two workflows are two ephemeral runners that share no disk. Running
      # the check in the same job, immediately before the compose step, means
      # there is no cross-run state to keep, nothing to parse out of a previous
      # message, and no artifact to fetch. The stall check next door avoids
      # cross-run state for exactly the same reason.
      #
      # THE 1st AND THE 15th is the nearest a cron expression gets to
      # fortnightly without drifting through the week, and it is stated in one
      # place (PARITY_CADENCE in scripts/lib/state-report.mjs) so the report and
      # this file cannot describe it differently.
      #
      # IT NEVER FAILS THE JOB. Five of the fifteen lines are red today. A step
      # that goes red on a finding, every run, for months, is a step somebody
      # switches off, and then the digest loses the one line that was the point.
      # The finding is delivered by being IN the email.
      # The day is decided in the shell rather than in an `if:` expression,
      # because `date -u` is the thing that actually knows what day it is on the
      # runner, and a GitHub expression would be a second, different answer to
      # the same question.
      - name: The fortnightly parity check
        continue-on-error: true
        env:
          PARITY_SITE: https://www.eventlinqs.com.au
        run: |
          set -u
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ] || [ "$DAY" = "15" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx playwright install --with-deps chromium
            node scripts/ops/parity-check.mjs --json parity.json
          else
            echo "Not the 1st or the 15th (today is $DAY). The parity check is not due."
          fi

      # THE WEEKLY INDEXING CHECK (close-out SEO2 step 3), in this job and for the
      # same reason as the parity check above: it writes a file and the compose
      # step below reads it, and two workflows are two runners that share no disk.
      #
      # MONDAY, said in one place (INDEXING_CADENCE in
      # scripts/lib/indexing-check.mjs) so this file and the digest cannot
      # describe the cadence differently. A weekday rather than a date, because
      # the thing it watches (the catalogue, and what Google has done with it)
      # moves with the week rather than with the month.
      #
      # IT NEVER FAILS THE JOB, for the reason written above the parity step: a
      # step that goes red on a finding every run is a step somebody switches
      # off, and the finding is delivered by being IN the email.
      #
      # GOOGLE_SEARCH_CONSOLE_KEY is passed if the repository holds it and the
      # check says plainly that Google was not asked when it does not. There is
      # no version of this that quietly reports "0 excluded" for a property
      # nobody has ever connected.
      - name: The weekly indexing check
        continue-on-error: true
        env:
          INDEXING_SITE: https://www.eventlinqs.com.au
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
        run: |
          set -u
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/ops/indexing-check.mjs --json indexing.json
          else
            echo "Not a Monday (day $DOW of the week). The indexing check is not due."
          fi

      - name: Compose and send
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF_SHA: ${{ github.sha }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -u
          if [ "${DRY:-false}" = "true" ]; then
            node scripts/ops/state-report.mjs --dry-run --json state.json --html state.html
          else
            node scripts/ops/state-report.mjs --json state.json --html state.html
          fi

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: state-report-${{ github.run_id }}
          path: |
            state.json
            state.html
            parity.json
            indexing.json
          if-no-files-found: ignore
          retention-days: 14

  stall:
    name: the stall check
    if: ${{ github.event.schedule == '25 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'stall') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Judge the silence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF_SHA: ${{ github.sha }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -u
          # --check-period-hours 1 is the schedule above, told to the judge. It
          # alerts only when the six-hour band is higher NOW than it was one
          # check ago, which makes exactly one run per band the one that speaks.
          # No state is kept anywhere and nothing parses a previous message, so
          # there is nothing to drift.
          #
          # A manual dispatch passes it too, deliberately: a hand run of the
          # stall check should behave exactly like the scheduled one, or it
          # proves something the scheduled one does not do.
          if [ "${DRY:-false}" = "true" ]; then
            node scripts/ops/state-report.mjs --stall --dry-run --check-period-hours 1
          else
            node scripts/ops/state-report.mjs --stall --check-period-hours 1
          fi
