# ADVISORY SINCE 25 AUGUST 2026, BY FOUNDER RULING. READ BEFORE RE-REQUIRING IT.
#
# This workflow was removed from main's required status checks. It still runs on
# every pull request, still asserts every threshold, and still fails loudly so the
# failure email arrives. It deliberately does NOT carry continue-on-error: a
# green-but-meaningless job would stop that email, and the email is the point.
#
# WHY. On the same commit and the same preview URLs, mobile, simulated throttling,
# after the image optimiser had been warmed:
#
#   /events                      CI 0.78, 0.76, 0.76   warmed real client 0.88
#   /events/cat-indie-sounds-... CI 0.71, 0.72, 0.79   warmed real client 0.86
#
# Same bytes, same build. The gap is the runner. No threshold was touched to reach
# that ruling and the audited set was not narrowed.
#
# The full evidence, what was fixed BEFORE the ruling (the 1,200-seat document, an
# accessibility regression, and this workflow's own warm pass which warmed no
# images at all), what remains, and the one-command way to re-require it, are in
# docs/perf/LIGHTHOUSE-GATE-ADVISORY-RULING-2026-08-25.md.
#
# Lighthouse CI gate - enforces docs/MEDIA-ARCHITECTURE.md §12.2.
#
# Hard gate covering every public page type, measured against the DEPLOYED
# VERCEL PREVIEW for the PR commit - not localhost.
#
# Why the preview, not localhost (changed on release/launch-line):
#   The previous gate booted a local Supabase stack, built the app, and ran
#   Lighthouse against `npm run start` on localhost:3000 with a HARDCODED seed
#   event slug (/events/afrobeats-melbourne-summer-sessions) in
#   lighthouserc.json. When the seed stopped producing that exact slug the
#   event-detail URL 404'd, and LHCI treats any 404 in the URL set as a hard
#   `collect` failure (ERRORED_DOCUMENT_REQUEST) - failing the whole gate
#   regardless of scores. The gate also did not measure the artefact users
#   actually receive. It now:
#     1. Resolves the warmed Vercel preview URL for the PR commit (from the
#        GitHub deployments API Vercel posts), then audits that.
#     2. Audits a FIXED, REVIEWED URL SET from lighthouse-gate-urls.json,
#        verified to answer 200 on the preview before LHCI sees it
#        (scripts/ci/resolve-gate-urls.mjs). Amended 25 August 2026: the set
#        used to be DISCOVERED from the preview sitemap (first/middle/last of
#        the sorted slugs). That is a pure function of a MOVING input, so the
#        audited page changed as the catalogue changed, and on 25 August the
#        gate landed on a 1,200 seat arena chart and blocked a merge for
#        0.75/0.74/0.77 against the same 0.80 floor a lighter page had cleared
#        days earlier. A missing pinned path now FAILS the resolver by name
#        rather than being silently substituted.
#     3. Warms ISR + the next/image optimiser with an unrecorded curl pass
#        before measuring, so the score reflects warm-cache reality (the
#        cold-start race is Issue #42, not a per-run flake).
#
# Thresholds are UNCHANGED from the prior gate - the locked assertion floors in
# lighthouserc.json (performance >= 0.80, a11y/BP = 1.00, CLS <= 0.1, with
# perf warn-waived on / and /culture/* per Issue #42) carry over verbatim. This
# change only moves the target to a reachable warmed preview; it does not amend
# any threshold.
#
# SEO, amended 16 August 2026. It is no longer a `categories:seo = 1.00` floor,
# because moving this gate onto the preview made that floor unreachable: a
# preview is noindex BY DESIGN (next.config.ts, 15 August 2026) and Lighthouse's
# is-crawlable audit is 4.04 of the SEO category's 13.04 weighted points, so a
# correctly-configured preview tops out at 0.69. The floor is now asserted audit
# by audit at minScore 1 - the same bar, since a category score of 1 is reached
# exactly when every weighted audit passes - plus scripts/ci/assert-seo-audits.mjs,
# which asserts indexability against the environment and so FAILS if a preview
# ever becomes indexable again. That is a check this gate did not previously have. Auth-gated surfaces (/dashboard/*, /admin/*, order
# confirmation, squad) stay excluded - they need a recorded-session gate
# (Module M7 / Pre-Task 5).

name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the Vercel preview URL for this commit. Vercel's GitHub integration
  # posts a GitHub Deployment (environment "Preview") with a success status
  # whose environment_url is the *.vercel.app preview. We poll that API
  # directly - no third-party action - and expose the URL downstream.
  # ---------------------------------------------------------------------------
  preview:
    name: Resolve Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - name: Wait for Vercel preview deployment
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "Resolving Vercel preview for commit $SHA"
          deadline=$(( $(date +%s) + 600 ))
          url=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ids=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" --jq '.[].id' 2>/dev/null || true)
            for id in $ids; do
              found=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                --jq 'map(select(.state=="success")) | .[0] | (.environment_url // .target_url) // empty' \
                2>/dev/null || true)
              if [ -n "$found" ] && printf '%s' "$found" | grep -q "vercel.app"; then
                url="$found"
                break
              fi
            done
            if [ -n "$url" ]; then break; fi
            echo "  ...preview not ready yet; sleeping 15s"
            sleep 15
          done
          if [ -z "$url" ]; then
            echo "::error::No successful Vercel preview deployment found for $SHA within 10 minutes."
            echo "::error::The Lighthouse gate measures the deployed preview; it cannot run until Vercel finishes the preview build."
            exit 1
          fi
          url="${url%/}"
          echo "Resolved preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Lighthouse mobile gate against the warmed preview.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse mobile gate
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve gate URLs
        run: |
          set -euo pipefail
          node scripts/ci/resolve-gate-urls.mjs > gate-urls.txt
          echo "Gating mobile on:"
          cat gate-urls.txt

      - name: Warm preview (unrecorded pass, pages AND the image optimiser)
        # THIS STEP USED TO CURL THE PAGE TWICE AND CALL THAT WARMING THE IMAGE
        # OPTIMISER. It is not. Every optimised image is a SEPARATE request to
        # /_next/image?url=...&w=...&q=..., each width generated on its first
        # request, and a request for the HTML never touches one. So the gate
        # measured a warm page with a cold hero on every run, which is the
        # cold-start race the config calls Issue #42.
        #
        # Measured on 25 August 2026 against the preview for 711b6cd6, same URL:
        #   in CI, after the old warm pass   perf 0.75, 0.72, 0.71
        #   from a warmed client             perf 0.91, LCP 2,768ms
        #
        # scripts/ci/warm-preview.mjs pulls every /_next/image URL out of the
        # markup and requests each variant. Its own first version read src and
        # srcset case-sensitively and found ONE variant on a page carrying
        # twenty-one, because Next 16 with React 19 serialises the attribute as
        # srcSet; it scans the raw markup for the path now.
        #
        # NO THRESHOLD IS CHANGED. This changes what is warm before the stopwatch
        # starts, which is what the warmed-preview requirement in CLAUDE.md
        # already asks for. The el-audit=1 cookie disables motion and hover wash,
        # matching the audited profile. Warming never fails the build.
        run: node scripts/ci/warm-preview.mjs gate-urls.txt

      - name: Run Lighthouse CI
        run: |
          set -euo pipefail
          args=""
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            args="$args --url=$u"
          done < gate-urls.txt
          npx --yes @lhci/cli@0.14.x collect --config=./lighthouserc.json $args

          # Print every run value and the aggregation the floors actually use,
          # BEFORE asserting. LHCI prints run values only on failure, so a
          # passing gate shows a single number with no indication of how it was
          # derived. On 2026-08-05 that cost hours: "found 0.74" from 0.72,
          # 0.74, 0.71 was read as a median when it is the maximum, and a
          # regression was chased on a branch that had changed zero bytes of
          # runtime code on the failing route. This is a reporter and never
          # fails the build; `lhci assert` below is the gate.
          node scripts/ci/lighthouse-aggregation-report.mjs .lighthouseci

          # The SEO half that a category floor cannot express, and this one DOES
          # fail the build. It asserts indexability against the ENVIRONMENT (a
          # preview must be blocked, production must be crawlable), and fails if
          # Lighthouse's SEO audit set drifts from the reviewed baseline that the
          # per-audit assertions in lighthouserc.json are written against. See the
          # header of that script for why SEO stopped being a category floor.
          node scripts/ci/assert-seo-audits.mjs .lighthouseci

          npx --yes @lhci/cli@0.14.x assert --config=./lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        run: npx --yes @lhci/cli@0.14.x upload --config=./lighthouserc.json || true
