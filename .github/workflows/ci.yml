name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time env. Real secrets live in Vercel - these placeholders
      # only satisfy `next build`'s client-bundle validation.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # The CANONICAL host. This was https://eventlinqs.com, which is one of the
      # hosts the canonical 301 redirects, and a placeholder that names the wrong
      # host is how the wrong host gets copied into the next thing.
      NEXT_PUBLIC_SITE_URL: https://www.eventlinqs.com.au

      # MAKE preview-deployment-state A REAL GATE.
      #
      # The guard runs inside `npm run build` (prebuild -> run-guards) and needs
      # three things to ask Vercel anything: a token, a project id and a team id.
      # It had NONE of them here, so it printed SKIP on every CI run since it was
      # written, and the VERCEL_TOKEN created for it on 15 August 2026 was never
      # reachable by the job that runs it. A secret nothing reads is not
      # protection.
      #
      # The two ids are identifiers, not secrets: they are the same values
      # `vercel link` writes into .vercel/project.json, which is gitignored, so
      # naming them here is what puts the contract in version control rather than
      # in a dashboard (Law 9, clause 3).
      #
      # This can only ever SKIP or FAIL-ON-ERROR: an absent, invalid or rejected
      # token exits 0 with a warning by design, so wiring it cannot break a build
      # that would otherwise pass.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_YIHLHcjuQfg4RmtNt7JekkcTVznJ
      VERCEL_ORG_ID: team_yPo8T18zSl5VczJfWIIrNqly

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FULL HISTORY, and only on this job.
          #
          # `npm run build` runs prebuild, which runs the guard registry, which
          # runs scripts/guards/no-ai-authorship.mjs. That guard reads commit
          # MESSAGES. actions/checkout defaults to fetch-depth 1, so it was being
          # handed a one-commit clone and reporting PASS having inspected a single
          # message: a gate announcing enforcement it was not performing, which is
          # worse than no gate, because it is believed.
          #
          # The guard now prints how many commits it scanned, so this setting is
          # verifiable from the CI log rather than taken on trust. A line reading
          # "scanned 1 commit(s)" means this block has been lost.
          #
          # The other two jobs (types-drift-guard, test) never run the guard and
          # keep the fast shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Copy laws + AI-tell lexicon
        run: node scripts/copy-tell-gate.mjs

      # Three critical-path defects that all LOOK correct in review:
      # next/dynamic called from a Server Component (splits nothing), a heavy
      # subsystem statically imported by a hot route, and Session Replay back
      # in the Sentry.init integrations array. Each one shipped here at least
      # once. Runs before the build because it is a source-level check and
      # fails in under a second.
      - name: Critical-path guard
        run: node scripts/ci/critical-path-guard.mjs

      # No Lighthouse exemption without a clock: every warn-level relaxation
      # carries an expiry date and this FAILS the build once that date passes.
      - name: Lighthouse exemption expiry
        run: node scripts/ci/lighthouse-exemption-expiry.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  types-drift-guard:
    name: types-drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # [2026-06-07] BLOCKING. The SUPABASE_ACCESS_TOKEN repository secret
    # is now configured and the guard was verified green on 6e6223c, so
    # schema-vs-committed-types drift gates merges as intended (the class
    # of bug that broke checkout on 2026-05-28). It was non-blocking from
    # 2026-05-28 only while the secret was unset. To temporarily relax it
    # (e.g. if the token is rotated and CI cannot reach the live schema),
    # set continue-on-error: true again with a dated reason.
    continue-on-error: false

    # Regenerates src/types/database.ts from the live Supabase schema
    # and diffs the result against the committed generated section. The
    # legacy-aliases appendix below the BEGIN LEGACY ALIASES marker is
    # excluded from the diff. Catches the schema-vs-code drift class of
    # bug that broke the checkout page on 2026-05-28 (PR #51).
    #
    # SUPABASE_ACCESS_TOKEN must be set as a repository secret. See
    # supabase.com/dashboard > account > access tokens. The token grants
    # read-only access to the project schema (no data); rotate annually.

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify SUPABASE_ACCESS_TOKEN is configured AND still valid
        # PRESENT is not the same as VALID. On 2026-07-10 this token expired.
        # The presence check below still passed, the guard then failed with a
        # generic "could not reach the live DB", CI concluded failure, and the
        # post-deploy smoke gate was skipped for two weeks as a side effect.
        # That is the platform's named worst failure class: a variable that
        # EXISTS but does not WORK. So the token is now actually exercised, and
        # an expired one says so in one line instead of masquerading as drift.
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::types-drift-guard requires repository secret SUPABASE_ACCESS_TOKEN."
            echo "::error::Add under Settings > Secrets and variables > Actions."
            echo "::error::Token needs schema-read access to project gndnldyfudbytbboxesk."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is set (length ${#SUPABASE_ACCESS_TOKEN})."
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects" || echo "000")
          if [[ "$CODE" == "401" || "$CODE" == "403" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is PRESENT but REJECTED by Supabase (HTTP $CODE): it has expired or been revoked."
            echo "::error::Rotate it: supabase.com/dashboard > account > access tokens, then update the repository secret."
            echo "::error::This is NOT schema drift. Nothing is wrong with the committed types."
            exit 1
          fi
          if [[ "$CODE" != "200" ]]; then
            echo "::warning::Unexpected HTTP $CODE from the Supabase API while validating the token; continuing to the drift check."
          else
            echo "SUPABASE_ACCESS_TOKEN accepted by the Supabase API (HTTP 200)."
          fi

      - name: Run types-drift guard
        run: bash scripts/check-types-drift.sh

  test:
    name: test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time env. Real secrets live in Vercel - these placeholders
      # only satisfy module imports that validate client-bundle env.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # The CANONICAL host, for the same reason as the verify job above.
      NEXT_PUBLIC_SITE_URL: https://www.eventlinqs.com.au

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
