name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is NOT among GitHub's default types (opened, synchronize,
    # reopened). Every job below skips a draft, so without it a draft marked
    # ready would never run CI at all. scripts/guards/workflows-skip-drafts.mjs
    # holds both halves.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# DRAFTS DO NOT RUN CI (close-out C2.2, 5 September 2026). Six failed-run
# emails arrived for one pull request because CI was being used as the test
# runner. Open the pull request as a DRAFT, work, pass `npm run gate:push`
# locally (the same checks, one command, wired as the pre-push hook), mark it
# ready, and CI runs exactly once. On a push event the draft expression is
# empty, so the event name is tested first and main keeps building.
jobs:
  verify:
    name: lint · typecheck · build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # 20, not 15, since 7 September 2026: the build step's prebuild guards
    # include preview-deployment-state, which now WAITS up to 600 s for this
    # commit's own Vercel deployment to settle. Measured on the last two green
    # runs, the build step starts 1m55s to 2m18s into the job and the whole job
    # took 3m32s to 4m48s, so the full wait plus the build fits inside 15 with
    # about a minute to spare, and a minute is not a margin. The budget is
    # wider so the guard's own verdict (FAILED after 600 s, naming the
    # deployment) is always what a red run shows, never a bare job timeout.
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # THE TEST PROJECT, SO CI JUDGES WHAT VERCEL JUDGES (close-out F1.2).
      #
      # These two carried https://example.supabase.co and ci-placeholder-anon-key
      # until 9 September 2026, and the cost is written in the log of run
      # 34290357211: community-layer-protected skipped its category half,
      # check-pricing-lock could not read pricing_rules and reported UNVERIFIED,
      # schema-ahead-of-code, door-live-published and event-lifecycle-installed
      # all skipped, and check-public-env reported four critical public variables
      # missing or malformed. Vercel carries the real project and judges every one
      # of them, so this job could pass a commit the deploy then refused. It did.
      #
      # The values are the TEST project vkapkibzokmfaxqogypq and its ANON key,
      # which is the key an anonymous browser already holds. Never production,
      # never the service role key. Both are declared in src/lib/env/manifest.mjs
      # with githubActions: true, so the env locks fail if either goes missing,
      # and SUPABASE_ENV_ISOLATION (alwaysBlocking) refuses any build here whose
      # resolved URL carries the production ref.
      #
      # THE OTHER TWO ARE HERE FOR THE SAME REASON (close-out F1.3). Both are
      # NEXT_PUBLIC values, already compiled into every page of the production
      # bundle, so a repository secret adds no exposure. They are here because
      # F1.3 requires this job to BLOCK on anything it would block on in
      # production, and a job that blocks on "the key is missing" while the key
      # is missing only from its own workflow file is measuring itself. The
      # Stripe key is TEST mode; the maps key is never called at build time,
      # only shape-checked.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.CI_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.CI_GOOGLE_MAPS_API_KEY }}
      # The CANONICAL host. This was https://eventlinqs.com, which is one of the
      # hosts the canonical 301 redirects, and a placeholder that names the wrong
      # host is how the wrong host gets copied into the next thing.
      NEXT_PUBLIC_SITE_URL: https://www.eventlinqs.com.au

      # MAKE preview-deployment-state A REAL GATE.
      #
      # The guard runs inside `npm run build` (prebuild -> run-guards) and needs
      # three things to ask Vercel anything: a token, a project id and a team id.
      # It had NONE of them here, so it printed SKIP on every CI run since it was
      # written, and the VERCEL_TOKEN created for it on 15 August 2026 was never
      # reachable by the job that runs it. A secret nothing reads is not
      # protection.
      #
      # The two ids are identifiers, not secrets: they are the same values
      # `vercel link` writes into .vercel/project.json, which is gitignored, so
      # naming them here is what puts the contract in version control rather than
      # in a dashboard (Law 9, clause 3).
      #
      # An absent, invalid or rejected token exits 0 with a warning by design, so
      # wiring it cannot break a build that would otherwise pass. With the token
      # it judges THE COMMIT UNDER TEST: since 7 September 2026 (close-out C16)
      # it waits for that commit's own deployment to settle (up to
      # PREVIEW_STATE_WAIT_SECONDS, default 600, inside this job's 20 minutes)
      # instead of judging whichever older deployment had settled, which is how
      # every green run on main had been passing on the previous commit, and
      # how the first merge after a red one would have gone red on the red one.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_YIHLHcjuQfg4RmtNt7JekkcTVznJ
      VERCEL_ORG_ID: team_yPo8T18zSl5VczJfWIIrNqly

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FULL HISTORY, and only on this job.
          #
          # `npm run build` runs prebuild, which runs the guard registry, which
          # runs scripts/guards/no-ai-authorship.mjs. That guard reads commit
          # MESSAGES. actions/checkout defaults to fetch-depth 1, so it was being
          # handed a one-commit clone and reporting PASS having inspected a single
          # message: a gate announcing enforcement it was not performing, which is
          # worse than no gate, because it is believed.
          #
          # The guard now prints how many commits it scanned, so this setting is
          # verifiable from the CI log rather than taken on trust. A line reading
          # "scanned 1 commit(s)" means this block has been lost.
          #
          # The other two jobs (types-drift-guard, test) never run the guard and
          # keep the fast shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Copy laws + AI-tell lexicon
        run: node scripts/copy-tell-gate.mjs

      # Three critical-path defects that all LOOK correct in review:
      # next/dynamic called from a Server Component (splits nothing), a heavy
      # subsystem statically imported by a hot route, and Session Replay back
      # in the Sentry.init integrations array. Each one shipped here at least
      # once. Runs before the build because it is a source-level check and
      # fails in under a second.
      - name: Critical-path guard
        run: node scripts/ci/critical-path-guard.mjs

      # No Lighthouse exemption without a clock: every warn-level relaxation
      # carries an expiry date and this FAILS the build once that date passes.
      - name: Lighthouse exemption expiry
        run: node scripts/ci/lighthouse-exemption-expiry.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  types-drift-guard:
    name: types-drift guard
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # [2026-06-07] BLOCKING. The SUPABASE_ACCESS_TOKEN repository secret
    # is now configured and the guard was verified green on 6e6223c, so
    # schema-vs-committed-types drift gates merges as intended (the class
    # of bug that broke checkout on 2026-05-28). It was non-blocking from
    # 2026-05-28 only while the secret was unset. To temporarily relax it
    # (e.g. if the token is rotated and CI cannot reach the live schema),
    # set continue-on-error: true again with a dated reason.
    continue-on-error: false

    # Regenerates src/types/database.ts from the live Supabase schema
    # and diffs the result against the committed generated section. The
    # legacy-aliases appendix below the BEGIN LEGACY ALIASES marker is
    # excluded from the diff. Catches the schema-vs-code drift class of
    # bug that broke the checkout page on 2026-05-28 (PR #51).
    #
    # SUPABASE_ACCESS_TOKEN must be set as a repository secret. See
    # supabase.com/dashboard > account > access tokens. The token grants
    # read-only access to the project schema (no data); rotate annually.

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify SUPABASE_ACCESS_TOKEN is configured AND still valid
        # PRESENT is not the same as VALID. On 2026-07-10 this token expired.
        # The presence check below still passed, the guard then failed with a
        # generic "could not reach the live DB", CI concluded failure, and the
        # post-deploy smoke gate was skipped for two weeks as a side effect.
        # That is the platform's named worst failure class: a variable that
        # EXISTS but does not WORK. So the token is now actually exercised, and
        # an expired one says so in one line instead of masquerading as drift.
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::types-drift-guard requires repository secret SUPABASE_ACCESS_TOKEN."
            echo "::error::Add under Settings > Secrets and variables > Actions."
            echo "::error::Token needs schema-read access to project gndnldyfudbytbboxesk."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is set (length ${#SUPABASE_ACCESS_TOKEN})."
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects" || echo "000")
          if [[ "$CODE" == "401" || "$CODE" == "403" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is PRESENT but REJECTED by Supabase (HTTP $CODE): it has expired or been revoked."
            echo "::error::Rotate it: supabase.com/dashboard > account > access tokens, then update the repository secret."
            echo "::error::This is NOT schema drift. Nothing is wrong with the committed types."
            exit 1
          fi
          if [[ "$CODE" != "200" ]]; then
            echo "::warning::Unexpected HTTP $CODE from the Supabase API while validating the token; continuing to the drift check."
          else
            echo "SUPABASE_ACCESS_TOKEN accepted by the Supabase API (HTTP 200)."
          fi

      - name: Run types-drift guard
        run: bash scripts/check-types-drift.sh

  production-parity:
    name: production parity
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Close-out C16.2.2 (7 September 2026). REQUIRED on main. Two merges went
    # red on main and failed to deploy after every pull-request check passed,
    # because a preview build reads TEST and a production build reads
    # production, and nothing on the pull request asked whether production
    # carries what the tree needs. This job asks, against production, read
    # only: every migration in supabase/migrations applied there, and the
    # production scope of the Vercel store satisfying src/lib/env/manifest.mjs.
    # scripts/guards/branch-protection-required.mjs fails the build if main
    # stops requiring it.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_YIHLHcjuQfg4RmtNt7JekkcTVznJ
      VERCEL_ORG_ID: team_yPo8T18zSl5VczJfWIIrNqly
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Production parity
        run: node scripts/ops/production-parity.mjs
  test:
    name: test (vitest)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time env. Real secrets live in Vercel - these placeholders
      # only satisfy module imports that validate client-bundle env.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # The CANONICAL host, for the same reason as the verify job above.
      NEXT_PUBLIC_SITE_URL: https://www.eventlinqs.com.au

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single definition of the Node major this platform is
          # tested on. Read it here rather than repeating the number, so the
          # runtime CI installs and the runtime the guards check against cannot
          # drift apart by editing one of them.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  main-red-alert:
    # UX4.3, IMMEDIATE, OUTAGE ONLY. Main going red used to produce exactly one
    # thing: GitHub's own "Run failed: CI" email, which is the same shape as the
    # email a branch gate sends when it is doing its job. Six of those arrived
    # for one pull request on 5 September and the one that mattered would have
    # looked identical.
    #
    # UX4.5 IS THE OTHER HALF OF THIS JOB, and it is the `push` condition. A
    # BRANCH gate failing raises nothing here, deliberately: it stays in the run
    # log and on the pull request, and it appears as one line in the daily state
    # email. scripts/guards/alert-routing.mjs fails the build if that condition
    # is ever loosened.
    name: main is red
    needs: [verify, types-drift-guard, production-parity, test]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          VERIFY: ${{ needs.verify.result }}
          DRIFT: ${{ needs.types-drift-guard.result }}
          PARITY: ${{ needs.production-parity.result }}
          SUITE: ${{ needs.test.result }}
        run: |
          set -u
          {
            echo "CI is RED on main. The next production deployment cannot go out until it is green."
            echo ""
            echo "lint / typecheck / build : ${VERIFY}"
            echo "types-drift guard        : ${DRIFT}"
            echo "production parity        : ${PARITY}"
            echo "test (vitest)            : ${SUITE}"
            echo ""
            echo "Production is still serving the last deployment that went out, so the site"
            echo "is up. What is broken is the road between here and the next release."
          } > main-red.txt
          node scripts/ops/alert-dispatch.mjs \
            --class outage \
            --target "https://www.eventlinqs.com.au" \
            --subject "CI is RED on main" \
            --body-file main-red.txt
